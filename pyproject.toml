[project]
name = "mavlink-ids"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Imran Bhuyan", email = "bhuyanalimrans@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pymavlink>=2.4.49",
]

[project.scripts]
mavlink-ids = "mavlink_ids:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
